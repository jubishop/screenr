# Dependency update policy: docs/development-workflow.md#dependency-updates
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Raise each exact package.json version to the new release.
    versioning-strategy: increase
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    # Existing labels only: with no labels, Dependabot creates its defaults.
    labels: [improvement]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [improvement, "area: tooling"]
