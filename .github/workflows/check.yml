name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR checks, but let a production deployment finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: screenr
          POSTGRES_PASSWORD: screenr-ci-only
          POSTGRES_DB: screenr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U screenr -d screenr_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://screenr:screenr-ci-only@127.0.0.1:5432/screenr_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check repository
        run: ./bin/check
      - name: Package Linux release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jubishop/screenr'
        run: npm run release:package
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jubishop/screenr'
        with:
          name: screenr-linux-x64-${{ github.sha }}
          path: .cache/screenr-*.tar.gz
          overwrite: true # Re-run all jobs can rebuild this run's release.
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jubishop/screenr'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://screenr.jubishop.com
    permissions:
      contents: read
      actions: write # Download and remove this run's temporary release artifact.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.SCREENR_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SCREENR_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/screenr-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/screenr-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/screenr-ssh/known_hosts"
      - name: Deploy checked release and verify health
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENR_DEPLOY_HOST: ${{ secrets.SCREENR_DEPLOY_HOST }}
          SCREENR_DEPLOY_KEY_FILE: ${{ runner.temp }}/screenr-ssh/key
          SCREENR_DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/screenr-ssh/known_hosts
        run: bin/deploy-ci
      - name: Remove deployment SSH files
        if: always()
        run: rm -rf "$RUNNER_TEMP/screenr-ssh"
