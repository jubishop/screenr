name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR checks, but let a production deployment finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read # Find the last successful production deployment.
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: screenr
          POSTGRES_PASSWORD: screenr-ci-only
          POSTGRES_DB: screenr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U screenr -d screenr_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://screenr:screenr-ci-only@127.0.0.1:5432/screenr_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # A skip must cover every commit since that deployment.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Isolate CI APT sources
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo install -m 0644 .github/ci-apt.conf /etc/apt/apt.conf.d/99-screenr-ci
      - run: npx playwright install --with-deps chromium
      - name: Install ShellCheck
        # Playwright's --with-deps step just refreshed the isolated APT index.
        run: sudo apt-get install --yes shellcheck
      - name: Install Caddy
        # Production's Caddy release, from the image .github/caddy/Dockerfile pins.
        run: |
          image=$(sed -n 's/^FROM //p' .github/caddy/Dockerfile)
          container=$(docker create --quiet "$image")
          docker cp --quiet "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          docker rm "$container"
          sudo install -m 0755 "$RUNNER_TEMP/caddy" /usr/local/bin/caddy
          caddy version
      - name: Check repository
        run: ./bin/check --full
      - name: Decide whether to deploy
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REVISION: ${{ github.sha }}
        run: bin/deployment-decision "$EVENT_NAME" "$REF" "$REVISION" >> "$GITHUB_OUTPUT"
      - name: Package Linux release
        if: steps.release.outputs.deploy == 'true' && github.repository == 'jubishop/screenr'
        run: npm run release:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.deploy == 'true' && github.repository == 'jubishop/screenr'
        with:
          name: screenr-linux-x64-${{ github.sha }}
          path: .cache/screenr-*.tar.gz
          overwrite: true # Re-run all jobs can rebuild this run's release.
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true' && github.repository == 'jubishop/screenr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://screenr.club
    permissions:
      contents: read
      actions: write # Download and remove this run's temporary release artifact.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.SCREENR_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SCREENR_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/screenr-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/screenr-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/screenr-ssh/known_hosts"
      - name: Deploy checked release and verify health
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENR_DEPLOY_HOST: ${{ secrets.SCREENR_DEPLOY_HOST }}
          SCREENR_DEPLOY_KEY_FILE: ${{ runner.temp }}/screenr-ssh/key
          SCREENR_DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/screenr-ssh/known_hosts
        run: bin/deploy-ci
      - name: Remove deployment SSH files
        if: always()
        run: rm -rf "$RUNNER_TEMP/screenr-ssh"
