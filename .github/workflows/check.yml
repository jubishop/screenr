name: Repository checks

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR checks, but let a production deployment finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

# Parallel jobs run what bin/check --full runs locally, so checks and
# deployment stay under 10 minutes. See docs/development-workflow.md#ci-jobs.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Isolate CI APT sources
        # tests/test_ci_apt.py exercises the policy installed here.
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo install -m 0644 .github/ci-apt.conf /etc/apt/apt.conf.d/99-screenr-ci
      - name: Install ShellCheck
        # The runner image ships ShellCheck, so APT runs only on an image without it.
        # See docs/development-workflow.md#ci-dependency-sources.
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          shellcheck --version
      - name: Check foundation
        run: ./bin/check
      - name: Check shell scripts, Python, formatting, and types
        run: bin/check-application --part static

  app:
    name: app (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        # Production's PostgreSQL major; the tag follows its minor releases.
        # See docs/development-workflow.md#ci-postgresql.
        image: postgres:18
        env:
          POSTGRES_USER: screenr
          POSTGRES_PASSWORD: screenr-ci-only
          POSTGRES_DB: screenr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U screenr -d screenr_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://screenr:screenr-ci-only@127.0.0.1:5432/screenr_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - run: npm ci
      # The browser harness tests run Playwright's headless Chromium. The runner
      # image already has its libraries, so the install skips --with-deps and APT.
      # See docs/development-workflow.md#ci-dependency-sources.
      - run: npx playwright install --only-shell chromium
      - name: Install Caddy
        # Production's Caddy release, from the image .github/caddy/Dockerfile pins.
        run: |
          image=$(sed -n 's/^FROM //p' .github/caddy/Dockerfile)
          container=$(docker create --quiet "$image")
          docker cp --quiet "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          docker rm "$container"
          sudo install -m 0755 "$RUNNER_TEMP/caddy" /usr/local/bin/caddy
          caddy version
      - name: Run application and database tests
        run: bin/check-application --part app --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  browser:
    name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        # Production's PostgreSQL major; the tag follows its minor releases.
        # See docs/development-workflow.md#ci-postgresql.
        image: postgres:18
        env:
          POSTGRES_USER: screenr
          POSTGRES_PASSWORD: screenr-ci-only
          POSTGRES_DB: screenr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U screenr -d screenr_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://screenr:screenr-ci-only@127.0.0.1:5432/screenr_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - run: npm ci
      # Headless Chromium without --with-deps, as in the app job.
      - run: npx playwright install --only-shell chromium
      - name: Build and run browser tests
        run: bin/check-application --part browser --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-${{ github.run_id }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      deployments: read # Find the last successful production deployment.
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    services:
      postgres:
        # Packaging migrates this database and starts the packaged server.
        # See docs/development-workflow.md#ci-postgresql.
        image: postgres:18
        env:
          POSTGRES_USER: screenr
          POSTGRES_PASSWORD: screenr-ci-only
          POSTGRES_DB: screenr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U screenr -d screenr_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://screenr:screenr-ci-only@127.0.0.1:5432/screenr_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # A skip must cover every commit since that deployment.
      - name: Decide whether to deploy
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REVISION: ${{ github.sha }}
        run: bin/deployment-decision "$EVENT_NAME" "$REF" "$REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.decision.outputs.deploy == 'true' && github.repository == 'jubishop/screenr'
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: Build and package Linux release
        if: steps.decision.outputs.deploy == 'true' && github.repository == 'jubishop/screenr'
        run: |
          npm ci
          npm run build
          npm run release:package
      - uses: actions/upload-artifact@v7
        if: steps.decision.outputs.deploy == 'true' && github.repository == 'jubishop/screenr'
        with:
          name: screenr-linux-x64-${{ github.sha }}
          path: .cache/screenr-*.tar.gz
          overwrite: true # Re-run all jobs can rebuild this run's release.
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  check:
    # The one result pull requests show and bin/deploy-ci requires: every job
    # above passed. It runs after a failure so that it reports the failure.
    needs: [static, app, browser, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null

  deploy:
    needs: [check, release]
    if: needs.release.outputs.deploy == 'true' && github.repository == 'jubishop/screenr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://screenr.club
    permissions:
      contents: read
      actions: write # Download and remove this run's temporary release artifact.
      id-token: write # Join the tailnet through Tailscale workload identity federation.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The server answers SSH only on its tailnet address. See docs/deployment.md#production-environment-setup.
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # Pinned: third-party action in a job holding deploy credentials (v4.2.0)
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.91.85.40
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.SCREENR_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SCREENR_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/screenr-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/screenr-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/screenr-ssh/known_hosts"
      - name: Deploy checked release and verify health
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENR_DEPLOY_HOST: ${{ secrets.SCREENR_DEPLOY_HOST }}
          SCREENR_DEPLOY_KEY_FILE: ${{ runner.temp }}/screenr-ssh/key
          SCREENR_DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/screenr-ssh/known_hosts
        run: bin/deploy-ci
      - name: Remove deployment SSH files
        if: always()
        run: rm -rf "$RUNNER_TEMP/screenr-ssh"
