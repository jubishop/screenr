name: Sentry intake

# Tracks each unresolved Sentry feedback item from the iPhone app and each
# unresolved Sentry error issue in screenr-ios and screenr-server in a GitHub
# issue, with a comment that has agents analyze it first. Issues hold only
# Sentry IDs and links, and a feedback item's date and build; see
# docs/development-workflow.md#daily-sentry-intake.

on:
  schedule:
    # 14:00 UTC is 07:00 PDT or 06:00 PST; GitHub cron uses UTC only.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sentry-intake
  cancel-in-progress: false

jobs:
  intake:
    name: Track unresolved feedback and errors
    if: github.repository == 'jubishop/screenr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: File, label, and comment on tracking issues
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bin/sentry-intake
