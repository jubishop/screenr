services:
  postgres:
    # Production's PostgreSQL major; the tag follows its minor releases.
    # See docs/development-workflow.md#ci-postgresql.
    image: postgres:18
    environment:
      POSTGRES_USER: screenr
      POSTGRES_PASSWORD: screenr-local-only
      POSTGRES_DB: screenr
    ports:
      - "127.0.0.1:${SCREENR_DB_PORT:-5439}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenr -d screenr"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres:
